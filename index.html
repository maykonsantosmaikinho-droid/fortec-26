<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORTEC — Gerador de Horários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#182741; --navy-2:#233a5e; --amber:#dd9a2b; --amber-deep:#b97c14;
  --steel:#6f83a1; --paper:#f7f4ec; --paper-2:#efeadd; --ink:#1a2233;
  --success:#2f9e58; --danger:#c8434f; --line:#e3ddcb; --white:#fffdf8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,.brand{font-family:'Fraunces',serif}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-weight:600}
input,select{font-family:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--white);color:var(--ink)}
.hidden{display:none!important}

/* ---- role gate ---- */
#roleGate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 15%, #24406b 0%, var(--navy) 55%, #101a2c 100%);padding:24px}
.rolebox{background:var(--white);border-radius:16px;padding:32px 28px;max-width:400px;width:100%;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.rolebrand{text-align:center;margin-bottom:22px}
.rolebrand .brand{color:var(--navy);font-size:30px;font-weight:700;letter-spacing:.5px}
.rolebrand .sub{color:var(--steel);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.rolebrand .bar{height:3px;width:46px;background:var(--amber);margin:12px auto 0;border-radius:3px}
.btn{padding:14px 16px;border-radius:10px;font-size:14px;width:100%;text-align:left;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.block{display:block;margin-bottom:10px}
.btn.primary{background:var(--navy);color:#fff}
.btn.light{background:var(--paper-2);color:var(--navy);border:1px solid var(--line)}
.btn.amber{background:var(--amber);color:#2a1c02}
.btn.danger{background:#fbe9ea;color:var(--danger)}
.btn.ghost{background:transparent;color:var(--steel);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:12.5px;width:auto}
.btn small,.btn span.hint{display:block;font:11px 'JetBrains Mono',monospace;font-weight:400;opacity:.75;margin-top:2px}

/* ---- app shell ---- */
#app{min-height:100vh}
.header{background:var(--navy);color:#fff;padding:14px 18px}
.stickyTop{position:sticky;top:0;z-index:20;background:var(--navy)}
.spaced{display:flex;align-items:center;justify-content:space-between;gap:10px}
.header .brand{font-size:19px;color:#fff;font-weight:600}
.header .sub{font-size:10.5px;color:#a9b8d1;letter-spacing:1.5px;text-transform:uppercase}
.header .bar{height:2px;width:30px;background:var(--amber);margin-top:5px;border-radius:2px}
.smallbtn{background:transparent;color:#cdd8ea;border:1px solid #3a4f77;padding:7px 12px;border-radius:7px;font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--navy-2);
  -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;
  mask-image:linear-gradient(to right, black calc(100% - 24px), transparent 100%);
  -webkit-mask-image:linear-gradient(to right, black calc(100% - 24px), transparent 100%);}
.tabs button{background:transparent;color:#cfdaee;padding:8px 13px;border-radius:20px;font-size:12.5px;white-space:nowrap;flex:none; scroll-snap-align:start;}
.tabs button.active{background:var(--amber);color:#2a1c02}
.tabs button.highlight{background:#c9860f33;color:var(--amber);border:1px solid var(--amber)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--steel);font-weight:700;display:block;margin-bottom:6px}
.muted{color:var(--steel);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ok{background:#e9f7ee;color:#1f7a41;border:1px solid #cdead9;padding:10px 12px;border-radius:9px;font-size:12.5px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.warn{background:#fff6e6;color:#8a5a06;border:1px solid #f1dca4;padding:10px 12px;border-radius:9px;font-size:12.5px;margin:8px 0}
.err{background:#fbe9ea;color:#8a1f2a;border:1px solid #f2c3c8;padding:10px 12px;border-radius:9px;font-size:12.5px;margin:8px 0}
.input{width:100%}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--paper-2);color:var(--navy)}
.pill.f{background:#e4ecfb;color:#1c3f8f}
.pill.m{background:#fdecd9;color:#93540a}
.teacher-group summary,.teacher-item summary,.discipline-card summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.teacher-group{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.teacher-group summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--paper-2)}
.teacher-group-body{padding:10px}
.teacher-item{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--white)}
.teacher-person-summary{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.teacher-name{font-weight:700}
.teacher-person-body{padding:0 12px 12px}
.discipline-card{border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:20px;background:var(--paper-2);color:var(--navy);font-size:12px;border:1px solid var(--line)}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.days{display:flex;gap:5px;margin:8px 0}
.day{flex:1;padding:7px 0;border-radius:7px;background:var(--paper-2);font-size:11.5px;text-align:center;border:1px solid var(--line);color:var(--steel)}
.day.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.slot{padding:8px 4px;border-radius:7px;background:var(--paper-2);border:1px solid var(--line);font-size:11px;color:var(--steel)}
.slot.active{background:var(--success);color:#fff;border-color:var(--success)}
.seg{display:grid;gap:6px;margin:8px 0}
.seg button{padding:7px;border-radius:7px;background:var(--paper-2);border:1px solid var(--line);font-size:12px;color:var(--steel)}
.seg button.active{background:var(--amber);color:#2a1c02;border-color:var(--amber-deep)}
.class-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.class-choice{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:6px;background:var(--white)}
.class-choice.selected{border-color:var(--amber-deep);background:#fff8ea}
.class-choice input.num{width:52px;padding:4px 6px}

/* schedule board — signature element */
.board-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:12px;background:var(--white);-webkit-overflow-scrolling:touch}
table.board{border-collapse:collapse;table-layout:fixed;width:auto}
table.board th,table.board td{border:1px solid var(--line);padding:0;text-align:center;vertical-align:top;width:150px;overflow:hidden}
table.board thead th{background:var(--navy);color:#fff;font:600 11px 'JetBrains Mono',monospace;letter-spacing:1px;padding:9px 4px;position:sticky;top:0;width:150px}
table.board .timecol{background:var(--paper-2);font:700 11px 'JetBrains Mono',monospace;color:var(--navy);padding:9px 6px;white-space:nowrap;width:96px}
.cell{min-height:40px;padding:5px 6px;cursor:pointer;transition:background .1s;border-bottom:1px dashed var(--line)}
.cell:last-child{border-bottom:none}
.cell:hover{background:#fff8ea}
.cell.empty{color:#c8c2ac;font-size:16px;border-bottom:none}
.cell .subj{font-weight:700;font-size:11px;color:var(--navy);overflow-wrap:break-word;word-break:break-word;line-height:1.25}
.cell .teach{font-size:10px;color:var(--steel);margin-top:1px;overflow-wrap:break-word;word-break:break-word}
.cell.f{border-left:3px solid #2c58b8}
.cell.m{border-left:3px solid var(--amber-deep)}
.cell.exc{background:#fff3d6}
.day-scroll{display:flex;overflow-x:auto;overflow-y:hidden;gap:14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-top:6px}
.day-panel{flex:0 0 92%;scroll-snap-align:start}
.day-dots{display:flex;gap:6px;justify-content:center;margin:8px 0 4px}
.day-dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.day-dots span.on{background:var(--amber-deep)}
.legend{display:flex;gap:14px;padding:10px 4px;font-size:11.5px;color:var(--steel);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}

.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:var(--white);border-radius:16px 16px 0 0;padding:18px;width:100%;max-width:480px;max-height:82vh;overflow-y:auto}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.optrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
.optrow button{padding:6px 12px;font-size:12px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--paper-2);border-radius:9px;padding:10px 12px}
.stat b{display:block;font-size:20px;color:var(--navy);font-family:'JetBrains Mono',monospace}
.stat span{font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.5px}
.violation{border-left:3px solid var(--danger);background:#fdf0f1;padding:8px 10px;border-radius:6px;margin-bottom:6px;font-size:12.5px}
.deficit{border-left:3px solid var(--amber-deep);background:#fff8ea;padding:8px 10px;border-radius:6px;margin-bottom:6px;font-size:12.5px}
.save-indicator{position:fixed;bottom:14px;right:14px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;z-index:60;opacity:0;transition:opacity .25s;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.save-indicator.show{opacity:1}
.subtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.subtabs button{padding:7px 12px;border-radius:8px;background:var(--paper-2);color:var(--navy);font-size:12px;border:1px solid var(--line)}
.subtabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.field{margin-bottom:10px}
.divider{height:1px;background:var(--line);margin:14px 0}
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .wrap{max-width:100%;padding:0}
  .card{border:none;padding:0}
}
</style>
</head>
<body>

<div id="roleGate" class="hidden">
  <div class="rolebox">
    <div class="rolebrand">
      <div class="brand">FORTEC</div>
      <div class="sub">Gerador de Horários</div>
      <div class="bar"></div>
    </div>
    <button class="btn primary block" onclick="setRole('admin')">Sou da escola
      <span class="hint">monto turmas, professores e gero o horário</span></button>
    <button class="btn light block" onclick="setRole('teacher')">Sou professor(a)
      <span class="hint">preencho minha disponibilidade</span></button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="stickyTop">
    <div class="header">
      <div class="spaced">
        <div>
          <div class="brand">FORTEC</div>
          <div class="sub">Gerador de Horários</div>
          <div class="bar"></div>
        </div>
        <button class="smallbtn" onclick="setRole(null)">sair</button>
      </div>
    </div>
    <div id="navTabs" class="tabs no-print"></div>
  </div>
  <main class="wrap" id="main"></main>
</div>

<div id="saveIndicator" class="save-indicator no-print"></div>
<div id="modalRoot"></div>

<script>

   backend separado.

  {start:'07:30',end:'08:20'},{start:'08:20',end:'09:10'},{start:'09:10',end:'10:00'},
  {start:'10:15',end:'11:05'},{start:'11:05',end:'11:55'},{start:'11:55',end:'12:45'},{start:'12:45',end:'13:35'}
].map(p=>({...p,startMin:toMin(p.start),endMin:toMin(p.end)}));

const SEGS = {
  F:{key:'F',label:'Fundamental',periods:FUND_PERIODS},
  M:{key:'M',label:'Médio/Técnico',periods:MEDIO_PERIODS}
};
const MEDIO_MIN_END_IDX = 4; // período que termina 11:55 (índice 0-based)

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

/* ---------------- estado ---------------- */

function availHas(req, day, idx){

  return !!(d && d.periods.includes(idx));
}
function toggleAvail(req, day, idx){
  let d = (req.availability||[]).find(a=>a.day===day);
  if(!d){ d={day,periods:[]}; req.availability=req.availability||[]; req.availability.push(d); }
  const i=d.periods.indexOf(idx);
  if(i>=0) d.periods.splice(i,1); else d.periods.push(idx);
}

/* ============================================================
   MOTOR DE GERAÇÃO — v2 (backtracking real)

   Fase A — "formato do dia": para cada turma, calcula quantos
   períodos ela tem em cada dia (a partir da carga semanal total
   dela), sempre a partir do 1º período (ou exceção na 2ª pro
   Médio) — isso garante ausência de janela e entrada correta por
   CONSTRUÇÃO, sem precisar checar depois.

   Fase B — encaixa as aulas nesses períodos já definidos usando
   backtracking de verdade: quando uma escolha trava o resto,
   desfaz e tenta outra, em vez de só recomeçar do zero.
   ============================================================ */
function overlaps(aStart,aEnd,bStart,bEnd){ return aStart<bEnd && bStart<aEnd; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function totalWeeklyLoad(classId){
  return db.requirements.filter(r=>r.classIds.includes(classId)).reduce((s,r)=>s+loadFor(r,classId),0);
}
// carga semanal de uma turma específica dentro de um requisito — usa classLoads (por turma)
// quando existir, senão cai no valor único antigo (lessonsPerWeek), pra manter compatibilidade.
function loadFor(req, classId){
  if(req.classLoads && req.classLoads[classId]!==undefined) return req.classLoads[classId];
  return req.lessonsPerWeek;
}

function computeDayShapes(){
  // classId -> day -> {start, load} | null (turma sem aula naquele dia)
  // Regra: nenhum dia ativo pode ter menos de 5 aulas (Fundamental e Médio), e
  // ninguém começa depois da 2ª aula (exceção só permitida na 2ª, nunca 3ª+).
  const MIN_DAY_LOAD = 5;
  const shapes={};
  db.classes.forEach(cls=>{
    shapes[cls.id]={};
    const seg=cls.segment, segLen=SEGS[seg].periods.length;
    let total = Math.min(totalWeeklyLoad(cls.id), segLen*5);
    const fullDays = Math.floor(total/segLen);
    const remainder = total - fullDays*segLen;
    DAYS.forEach((day,i)=>{
      if(i<fullDays){ shapes[cls.id][day] = {start:0, load:segLen}; }
      else if(i===fullDays && remainder>0){
        if(remainder>=MIN_DAY_LOAD){ shapes[cls.id][day] = {start:0, load:remainder}; }
        else if(remainder>=MIN_DAY_LOAD-1){ shapes[cls.id][day] = {start:1, load:remainder}; } // exceção: entra na 2ª aula
        else { shapes[cls.id][day] = {start:0, load:remainder}; } // carga curta demais para bater o mínimo — violação honesta na auditoria
      } else { shapes[cls.id][day]=null; }
    });
  });
  return shapes;
}

function buildNeedUnits(){
  const units=[];
  db.requirements.forEach(req=>{
    if(req.classIds.length===0 || !req.subjectId) return;
    if(req.joint){
      // conjunta: todas as turmas do grupo, ao mesmo tempo, mesma carga pro grupo inteiro
      for(let i=0;i<req.lessonsPerWeek;i++){
        units.push({id:uid('need'), reqId:req.id, teacherId:req.teacherId, subjectId:req.subjectId,
          segment:req.segment, classIds:[...req.classIds], joint:true, availability:req.availability||[]});
      }
    } else {
      // não-conjunta: cada turma é independente, cada uma com sua própria carga (loadFor)
      req.classIds.forEach(cid=>{
        const n = loadFor(req, cid);
        for(let i=0;i<n;i++){
          units.push({id:uid('need'), reqId:req.id, teacherId:req.teacherId, subjectId:req.subjectId,
            segment:req.segment, classIds:[cid], joint:false, availability:req.availability||[]});
        }
      });
    }
  });
  return units;
}
// versão "por requisito" (não por ocorrência) usada pelo editor manual, pra listar opções pendentes
function expandNeeds(){
  return db.requirements.filter(r=>r.classIds.length && r.subjectId).map(req=>({
    id:uid('need'), reqId:req.id, teacherId:req.teacherId, subjectId:req.subjectId,
    segment:req.segment, classIds:[...req.classIds], joint:req.joint, availability:req.availability||[]
  }));
}

function solveBacktrack(units, shapes, opts){
  const classSlots={}; // classId -> day -> idx -> unitId|null (só dentro do range ativo)
  db.classes.forEach(c=>{
    classSlots[c.id]={};
    DAYS.forEach(day=>{
      const shp=shapes[c.id][day];
      classSlots[c.id][day] = shp? new Array(shp.load).fill(null) : [];
    });
  });
  const teacherIntervals={}; db.teachers.forEach(t=>{ teacherIntervals[t.id]={}; DAYS.forEach(d=>teacherIntervals[t.id][d]=[]); });

  // gera lista de slots-alvo (todos os períodos ativos de todas as turmas) — é isso que precisa ficar 100% preenchido
  const targetSlots=[]; // {classId, day, idxInDay, realIdx}
  db.classes.forEach(c=>DAYS.forEach(day=>{
    const shp=shapes[c.id][day]; if(!shp) return;
    for(let k=0;k<shp.load;k++) targetSlots.push({classId:c.id, day, k, realIdx:shp.start+k});
  }));

  function teacherFree(teacherId, seg, day, realIdx, ignore){
    const p=SEGS[seg].periods[realIdx];
    return !teacherIntervals[teacherId][day].some(iv=> iv.unitId!==ignore && overlaps(iv.start,iv.end,p.startMin,p.endMin));
  }
  function slotFree(classId, day, k){ return classSlots[classId][day][k]===null; }

  function domainFor(unit){
    const out=[];
    unit.classIds.forEach(()=>{});
    DAYS.forEach(day=>{
      // todas as turmas do requisito precisam ter slot ativo e livre nesse dia, no MESMO período real
      const shapesOfMembers = unit.classIds.map(cid=>shapes[cid][day]);
      if(shapesOfMembers.some(s=>!s)) return;
      // interseção de períodos reais possíveis entre os membros nesse dia
      const realRanges = unit.classIds.map(cid=>{ const s=shapes[cid][day]; return [s.start, s.start+s.load-1]; });
      const lo = Math.max(...realRanges.map(r=>r[0])), hi = Math.min(...realRanges.map(r=>r[1]));
      for(let realIdx=lo; realIdx<=hi; realIdx++){
        if(!unit.availability.some(a=>a.day===day && a.periods.includes(realIdx))) continue;
        if(!teacherFree(unit.teacherId, unit.segment, day, realIdx)) continue;
        const allFree = unit.classIds.every(cid=>{ const s=shapes[cid][day]; return slotFree(cid, day, realIdx-s.start); });
        if(!allFree) continue;
        out.push({day, realIdx});
      }
    });
    return out;
  }

  function place(unit, day, realIdx){
    const p=SEGS[unit.segment].periods[realIdx];
    teacherIntervals[unit.teacherId][day].push({start:p.startMin,end:p.endMin,unitId:unit.id});
    unit.classIds.forEach(cid=>{ const s=shapes[cid][day]; classSlots[cid][day][realIdx-s.start]=unit.id; });
    unit._placed={day,realIdx};
  }
  function unplace(unit){
    if(!unit._placed) return;
    const {day,realIdx}=unit._placed;
    teacherIntervals[unit.teacherId][day] = teacherIntervals[unit.teacherId][day].filter(iv=>iv.unitId!==unit.id);
    unit.classIds.forEach(cid=>{ const s=shapes[cid][day]; classSlots[cid][day][realIdx-s.start]=null; });
    unit._placed=null;
  }

  let steps=0;
  const STEP_LIMIT = opts.stepLimit || 250000;
  const order = opts.shuffled ? shuffle([...units]) : units;

  function mrvNext(remaining){
    let best=null, bestLen=Infinity;
    for(const u of remaining){
      const d = domainFor(u);
      if(d.length<bestLen){ bestLen=d.length; best={unit:u, domain:d}; if(bestLen===0) break; }
    }
    return best;
  }

  const pending = [...order];
  let timedOut=false;
  // guarda o melhor estado parcial encontrado (mais unidades colocadas), pra não perder
  // progresso quando não existe solução 100% perfeita — em vez de desistir com tudo zerado.
  let bestPlacedCount=-1, bestSnapshot=null;
  function snapshotIfBest(){
    const placedCount = units.length - pending.length;
    if(placedCount>bestPlacedCount){
      bestPlacedCount=placedCount;
      bestSnapshot = units.filter(u=>u._placed).map(u=>({unitId:u.id, day:u._placed.day, realIdx:u._placed.realIdx}));
    }
  }
  function backtrack(){
    if(timedOut) return false;
    if(pending.length===0) return true;
    steps++;
    if(steps>STEP_LIMIT){ timedOut=true; return false; }
    const {unit, domain} = mrvNext(pending);
    if(domain.length===0) return false;
    const idx = pending.indexOf(unit);
    pending.splice(idx,1);
    const candidates = opts.shuffled? shuffle(domain) : domain;
    for(const cand of candidates){
      place(unit, cand.day, cand.realIdx);
      snapshotIfBest();
      const res = backtrack();
      if(res===true) return true;
      if(timedOut) return false;
      unplace(unit);
    }
    pending.splice(idx,0,unit);
    return false;
  }

  const result = backtrack();
  if(result!==true && bestSnapshot && bestPlacedCount>0){
    // não fechou 100% — restaura o melhor estado parcial encontrado durante a busca
    units.forEach(u=>u._placed=null);
    const byId={}; units.forEach(u=>byId[u.id]=u);
    bestSnapshot.forEach(s=>{ byId[s.unitId]._placed={day:s.day, realIdx:s.realIdx}; });
  }
  const lessons = units.filter(u=>u._placed).map(u=>({
    id:uid('lsn'), day:u._placed.day, period:u._placed.realIdx, segment:u.segment,
    teacherId:u.teacherId, subjectId:u.subjectId, classIds:[...u.classIds], requirementId:u.reqId
  }));
  const unplaced = units.filter(u=>!u._placed).length;
  return {lessons, unplaced, complete: result===true};
}

function generateSchedule(){
  const shapes = computeDayShapes();
  let best=null, bestScore=Infinity;
  const ATTEMPTS=6;
  for(let i=0;i<ATTEMPTS;i++){
    const allUnits = buildNeedUnits();
    // pré-filtro: remove unidades estruturalmente impossíveis (ex: aula conjunta cujas
    // turmas não têm nenhum dia/período em comum dado o formato do dia de cada uma) —
    // sem isso, uma única unidade impossível travaria TODO o backtracking sem colocar nada.
    const staticImpossible=[];
    const units = allUnits.filter(u=>{
      const possible = DAYS.some(day=>{
        const shapesOfMembers = u.classIds.map(cid=>shapes[cid][day]);
        if(shapesOfMembers.some(s=>!s)) return false;
        const realRanges = u.classIds.map(cid=>{ const s=shapes[cid][day]; return [s.start, s.start+s.load-1]; });
        const lo = Math.max(...realRanges.map(r=>r[0])), hi = Math.min(...realRanges.map(r=>r[1]));
        if(lo>hi) return false;
        return u.availability.some(a=>a.day===day && a.periods.some(p=>p>=lo && p<=hi));
      });
      if(!possible) staticImpossible.push(u);
      return possible;
    });
    const result = solveBacktrack(units, shapes, {shuffled:i>0, stepLimit:180000});
    const audit = auditSchedule(result.lessons);
    staticImpossible.forEach(u=>{
      audit.deficits.push(`${u.classIds.map(className).join('+')} — ${subjectName(u.subjectId)} — impossível de encaixar (disponibilidade não cobre nenhum período ativo dessa turma)`);
    });
    const score = audit.hardViolations.length*100000 + (audit.deficits.length+result.unplaced)*1000 + audit.softScore;
    if(score<bestScore){ bestScore=score; best={...result, audit}; }
    if(result.complete && staticImpossible.length===0 && audit.hardViolations.length===0 && audit.deficits.length===0) break;
  }
  db.schedule = { lessons:best.lessons, generatedAt:new Date().toISOString(), stale:false,
    exceptionsUsed:0, audit: best.audit };
  scheduleSave();
}

/* ---------------- AUDITORIA INDEPENDENTE ---------------- */
function auditSchedule(lessons){
  const hardViolations=[]; const deficits=[]; let softScore=0;

  // necessidade x programado
  db.requirements.forEach(req=>{
    if(req.joint){
      const have = lessons.filter(l=>l.requirementId===req.id).length;
      if(have<req.lessonsPerWeek) deficits.push(`${subjectName(req.subjectId)} (conjunta ${req.classIds.map(className).join('+')}) — necessário ${req.lessonsPerWeek}, programado ${have}`);
      if(have>req.lessonsPerWeek) hardViolations.push(`${subjectName(req.subjectId)} (conjunta ${req.classIds.map(className).join('+')}) recebeu mais aulas que a carga cadastrada (${have}/${req.lessonsPerWeek})`);
    } else {
      req.classIds.forEach(cid=>{
        const need = loadFor(req, cid);
        const have = lessons.filter(l=>l.requirementId===req.id && l.classIds.length===1 && l.classIds[0]===cid).length;
        if(have<need) deficits.push(`${className(cid)} — ${subjectName(req.subjectId)} — necessário ${need}, programado ${have}`);
        if(have>need) hardViolations.push(`${className(cid)} — ${subjectName(req.subjectId)} recebeu mais aulas que a carga cadastrada (${have}/${need})`);
      });
    }
  });

  // conflito real de professor (por horário, não por índice de período)
  const byTeacherDay={};
  lessons.forEach(l=>{
    const key=l.teacherId+'|'+l.day;
    byTeacherDay[key]=byTeacherDay[key]||[];
    const p=SEGS[l.segment].periods[l.period];
    byTeacherDay[key].push({start:p.startMin,end:p.endMin,l});
  });
  Object.values(byTeacherDay).forEach(list=>{
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
      if(overlaps(list[i].start,list[i].end,list[j].start,list[j].end)){
        hardViolations.push(`Professor ${teacherName(list[i].l.teacherId)} tem sobreposição real em ${DAY_LABELS[list[i].l.day]} (${subjectName(list[i].l.subjectId)} × ${subjectName(list[j].l.subjectId)})`);
      }
    }
  });

  // por turma: janelas, entrada, saída do Médio
  db.classes.forEach(cls=>{
    const seg=cls.segment;
    DAYS.forEach(day=>{
      const dayLessons = lessons.filter(l=>l.classIds.includes(cls.id) && l.day===day).sort((a,b)=>a.period-b.period);
      if(dayLessons.length===0) return;
      const idxs = dayLessons.map(l=>l.period);
      const first=Math.min(...idxs), last=Math.max(...idxs);
      // janela: todo período entre first..last deve estar ocupado
      for(let i=first;i<=last;i++){
        if(!idxs.includes(i)){ hardViolations.push(`${cls.name} tem janela em ${DAY_LABELS[day]} (período ${i+1} vazio entre aulas)`); break; }
      }
      if(seg==='F' && first!==0) hardViolations.push(`${cls.name} (Fundamental) não começa na 1ª aula em ${DAY_LABELS[day]}`);
      if(seg==='M'){
        if(first>1) hardViolations.push(`${cls.name} (Médio) começa depois da 2ª aula em ${DAY_LABELS[day]}`);
        if(first===1) softScore+=500;
        if(last<MEDIO_MIN_END_IDX) hardViolations.push(`${cls.name} (Médio) sai antes de 11:55 em ${DAY_LABELS[day]} (última aula: ${SEGS.M.periods[last].end})`);
      }
    });
  });

  return {hardViolations, deficits, softScore, ok: hardViolations.length===0 && deficits.length===0};
}

/* ---------------- validação de movimento manual ---------------- */
function validSlotsFor(need){
  const seg=need.segment, segLen=SEGS[seg].periods.length;
  const out=[];
  DAYS.forEach(day=>{
    for(let idx=0; idx<segLen; idx++){
      if(!need.availability.some(a=>a.day===day && a.periods.includes(idx))) continue;
      // professor livre?
      const busy = db.schedule.lessons.some(l=>l.teacherId===need.teacherId && l.day===day &&
        overlaps(SEGS[l.segment].periods[l.period].startMin, SEGS[l.segment].periods[l.period].endMin, SEGS[seg].periods[idx].startMin, SEGS[seg].periods[idx].endMin));
      if(busy) continue;
      // turma(s) livres nesse slot?
      const classBusy = need.classIds.some(cid=> db.schedule.lessons.some(l=>l.classIds.includes(cid) && l.day===day && l.period===idx));
      if(classBusy) continue;
      out.push({day, idx});
    }
  });
  return out;
}

      <div class="stat"><b>${db.teachers.length}</b><span>Professores</span></div>

      <div class="stat"><b>${db.requirements.length}</b><span>Necessidades</span></div>
      <div class="stat"><b>${db.requirements.reduce((s,r)=>s+(r.joint?r.lessonsPerWeek:r.lessonsPerWeek*r.classIds.length),0)}</b><span>Aulas/semana</span></div>
    </div>
    ${invalid.length? `<div class="err">⚠ ${invalid.length} requisito(s) incompleto(s) (sem disciplina, sem turma ou sem disponibilidade marcada). Corrija na aba Professores antes de gerar — eles serão ignorados na geração.</div>`:''}
    ${stale? `<div class="warn">⚠ O horário atual foi gerado antes de uma alteração recente nos dados. Recomenda-se gerar novamente.</div>`:''}
    <button class="btn amber block" style="margin-top:10px" onclick="runGenerate()">⚙ GERAR HORÁRIO FINAL</button>

}
function renderAuditSummaryCard(audit){

    <div class="spaced"><h3 style="margin:0">Resultado da auditoria</h3>
      ${audit.ok? `<span class="ok" style="margin:0">✅ HORÁRIO VÁLIDO</span>` : `<span class="err" style="margin:0">❌ ${audit.hardViolations.length+audit.deficits.length} problema(s)</span>`}
    </div>
    ${audit.hardViolations.map(v=>`<div class="violation">🔴 ${v}</div>`).join('')}
    ${audit.deficits.map(v=>`<div class="deficit">🟡 ${v}</div>`).join('')}
    ${audit.ok? `<p class="muted">Turmas, professores e disciplinas conferidos individualmente — nenhuma violação encontrada.</p>`:''}
  </div>`;
}
function runGenerate(){
  document.getElementById('main').innerHTML = `<div class="card"><p class="mono">Validando dados…<br>Construindo modelo…<br>Buscando solução…<br>Otimizando…<br>Auditando…</p></div>`;
  setTimeout(()=>{ generateSchedule(); state.adminTab='horario'; render(); }, 220);
}

function renderHorario(){
  if(!db.schedule) return `<div class="card"><p class="muted">Nenhum horário gerado ainda. Vá em <b>Gerar Horário</b>.</p></div>`;
  const views=[['geral','Geral'],['turma','Por turma'],['professor','Por professor']];
  let filterHtml='';
  if(state.scheduleView==='turma'){
    filterHtml = `<select class="input" onchange="setScheduleFilter(this.value)">
      <option value="">Escolha a turma…</option>
      ${db.classes.map(c=>`<option value="${c.id}" ${state.scheduleFilter===c.id?'selected':''}>${c.name}</option>`).join('')}
    </select>`;
  } else if(state.scheduleView==='professor'){
    filterHtml = `<select class="input" onchange="setScheduleFilter(this.value)">
      <option value="">Escolha o professor…</option>
      ${db.teachers.map(t=>`<option value="${t.id}" ${state.scheduleFilter===t.id?'selected':''}>${t.name}</option>`).join('')}

  }
  return `<div class="row no-print" style="justify-content:space-between;margin-bottom:8px">

    <div class="row">
      <button class="btn light sm" onclick="exportExcel()">⬇ Excel</button>
      <button class="btn light sm" onclick="exportCSVFallback()">⬇ CSV</button>
      <button class="btn light sm" onclick="window.print()">🖨 PDF/Imprimir</button>
    </div>
  </div>

}
function setScheduleView(v){ state.scheduleView=v; state.scheduleFilter=null; render(); }
function setScheduleFilter(v){ state.scheduleFilter=v; render(); }

function renderScheduleContent(){
  if(state.scheduleView==='geral'){
    return `${renderAuditBanner()}
      <h3>Ensino Fundamental</h3>${renderBoardByDay('F')}
      <h3 style="margin-top:18px">Médio/Técnico</h3>${renderBoardByDay('M')}${renderLegend()}`;
  }
  if(state.scheduleView==='turma'){
    if(!state.scheduleFilter) return `<p class="muted">Selecione uma turma.</p>`;
    return renderBoard(classSeg(state.scheduleFilter), state.scheduleFilter)+renderLegend();
  }
  if(state.scheduleView==='professor'){
    if(!state.scheduleFilter) return `<p class="muted">Selecione um professor.</p>`;
    return renderTeacherBoard(state.scheduleFilter);
  }
}
function renderBoardMulti(classIds){
  if(classIds.length===0) return `<p class="muted">Nenhuma turma.</p>`;
  const classes = db.classes.filter(c=>classIds.includes(c.id));
  // uma tabela por turma (igual ao Excel: cada turma tem sua própria grade), não uma
  // tabela só com todas as turmas espremidas na mesma célula.
  return classes.map(c=>`<h4 style="margin:14px 0 4px">${c.name}</h4>${renderBoardForClasses(classSeg(c.id), [c])}`).join('');
}
function renderLegend(){
  return `<div class="legend no-print"><span><i class="dot" style="background:#2c58b8"></i>Fundamental</span>
    <span><i class="dot" style="background:var(--amber-deep)"></i>Médio/Técnico</span>
    <span><i class="dot" style="background:#fff3d6;border:1px solid var(--amber-deep)"></i>Entrada exceção (2ª aula)</span></div>`;
}
function renderAuditBanner(){
  if(!db.schedule || !db.schedule.audit) return '';
  const a = db.schedule.audit;
  if(a.ok) return `<div class="ok" style="margin-bottom:14px">✓ Todas as aulas foram alocadas sem conflitos e sem janelas nas turmas.</div>`;
  return `<div class="err" style="margin-bottom:14px">❌ ${a.hardViolations.length+a.deficits.length} problema(s) encontrados — veja a aba Auditoria.</div>`;
}
function renderBoardByDay(seg){
  const classes = db.classes.filter(c=>c.segment===seg);
  if(classes.length===0) return `<p class="muted">Nenhuma turma neste segmento.</p>`;
  const periods = SEGS[seg].periods;
  const panels = DAYS.map(day=>{
    let rows='';
    periods.forEach((p,idx)=>{
      rows+=`<tr><td class="timecol">${p.start}–${p.end}</td>`;
      classes.forEach(c=>{
        const l = db.schedule && db.schedule.lessons.find(l=>l.day===day && l.period===idx && l.classIds.includes(c.id));
        if(!l){ rows+=`<td><div class="cell empty" onclick="openCellEditor('${c.id}','${day}',${idx})">·</div></td>`; }
        else {
          rows+=`<td><div class="cell ${seg.toLowerCase()}" onclick="openLessonEditor('${l.id}')">
            <div class="subj">${subjectName(l.subjectId)}</div>
            <div class="teach">${teacherName(l.teacherId)}${l.classIds.length>1?' · '+l.classIds.filter(x=>x!==c.id).map(className).join('+'):''}</div>
          </div></td>`;
        }
      });
      rows+='</tr>';
    });
    return `<div class="day-panel">
      <h4 style="margin:0 0 6px;color:var(--steel);text-align:center">${DAY_LABELS[day]}</h4>
      <div class="board-wrap"><table class="board">
        <thead><tr><th class="timecol">Horário</th>${classes.map(c=>`<th>${c.name}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`;
  }).join('');
  const dots = DAYS.map(()=>`<span></span>`).join('');
  return `<p class="muted no-print" style="text-align:center;margin:4px 0">arraste pro lado para ver os outros dias →</p>
    <div class="day-scroll">${panels}</div>
    <div class="day-dots no-print">${dots}</div>`;
}
function renderBoard(seg, onlyClassId){
  const classes = onlyClassId? db.classes.filter(c=>c.id===onlyClassId) : db.classes.filter(c=>c.segment===seg);
  return renderBoardForClasses(seg, classes);
}
function renderBoardForClasses(seg, classes){
  if(classes.length===0) return `<p class="muted">Nenhuma turma neste segmento.</p>`;
  const periods=SEGS[seg].periods;
  let rows='';
  periods.forEach((p,idx)=>{
    rows+=`<tr><td class="timecol">${idx+1}ª · ${p.start}–${p.end}</td>`;
    DAYS.forEach(day=>{
      // cada célula mostra as aulas dessa turma-lista neste dia/período
      const cellClasses = classes.map(c=>{
        const l = db.schedule.lessons.find(l=>l.day===day && l.period===idx && l.classIds.includes(c.id));
        if(!l) return `<div class="cell empty" onclick="openCellEditor('${c.id}','${day}',${idx})">·</div>`;
        const exc = (idx===1 && seg==='M' && !db.schedule.lessons.some(x=>x.day===day && x.period===0 && x.classIds.includes(c.id)));
        return `<div class="cell ${seg.toLowerCase()} ${exc?'exc':''}" onclick="openLessonEditor('${l.id}')">
          <div class="subj">${subjectName(l.subjectId)}${classes.length>1?' · '+className(c.id):''}</div>
          <div class="teach">${teacherName(l.teacherId)}${l.classIds.length>1?' · '+l.classIds.filter(x=>x!==c.id).map(className).join('+'):''}</div>
        </div>`;
      }).join('');
      rows+=`<td>${cellClasses}</td>`;
    });
    rows+='</tr>';
  });
  return `<div class="board-wrap"><table class="board">
    <thead><tr><th class="timecol">Período</th>${DAYS.map(d=>`<th>${DAY_LABELS[d]}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function renderTeacherBoard(teacherId){
  const lessons = db.schedule.lessons.filter(l=>l.teacherId===teacherId);
  const segsUsed = [...new Set(lessons.map(l=>l.segment))];
  if(lessons.length===0) return `<p class="muted">Este professor não possui aulas no horário gerado.</p>`;
  let out='';
  segsUsed.forEach(seg=>{
    const periods=SEGS[seg].periods;
    let rows='';
    periods.forEach((p,idx)=>{
      rows+=`<tr><td class="timecol">${idx+1}ª · ${p.start}–${p.end}</td>`;
      DAYS.forEach(day=>{
        const l = lessons.find(l=>l.day===day && l.period===idx && l.segment===seg);
        rows+= l? `<td><div class="cell ${seg.toLowerCase()}"><div class="subj">${subjectName(l.subjectId)}</div><div class="teach">${l.classIds.map(className).join('+')}</div></div></td>` : `<td><div class="cell empty">·</div></td>`;
      });
      rows+='</tr>';
    });
    out += `<h3>${SEGS[seg].label}</h3><div class="board-wrap"><table class="board"><thead><tr><th class="timecol">Período</th>${DAYS.map(d=>`<th>${DAY_LABELS[d]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  });
  return out+renderLegend();
}

/* edição manual */
function openLessonEditor(lessonId){
  const l = db.schedule.lessons.find(x=>x.id===lessonId);
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `<div class="modal-bg" onclick="closeModal(event)"><div class="modal">
    <h3 style="margin-top:0">${subjectName(l.subjectId)} — ${l.classIds.map(className).join(' + ')}</h3>
    <p class="muted">${DAY_LABELS[l.day]} · ${SEGS[l.segment].periods[l.period].start}–${SEGS[l.segment].periods[l.period].end} · ${teacherName(l.teacherId)}</p>
    <button class="btn danger block" onclick="removeLessonManual('${l.id}')">Remover desta célula (a aula volta a ser pendente)</button>
    <button class="btn ghost block" onclick="document.getElementById('modalRoot').innerHTML=''">Cancelar</button>
  </div></div>`;
}
function removeLessonManual(lessonId){
  db.schedule.lessons = db.schedule.lessons.filter(l=>l.id!==lessonId);
  db.schedule.audit = auditSchedule(db.schedule.lessons);
  document.getElementById('modalRoot').innerHTML='';
  scheduleSave(); render();
}
function openCellEditor(classId, day, idx){
  const cls = db.classes.find(c=>c.id===classId);
  const seg = cls.segment;
  // possíveis necessidades pendentes para essa turma nesse segmento
  const needs = expandNeeds().filter(n=> n.segment===seg && n.classIds.includes(classId) && n.classIds.every(cid=>{
    const already = db.schedule.lessons.filter(l=>l.requirementId===n.reqId && (n.joint? true : l.classIds.length===1 && l.classIds[0]===cid)).length;
    return true;
  }));
  const options = needs.map(n=>{
    const req = reqOf(n.reqId);
    const scheduled = db.schedule.lessons.filter(l=>l.requirementId===n.reqId && (n.joint? l.classIds.join(',')===n.classIds.join(',') : l.classIds.length===1 && l.classIds[0]===classId)).length;
    if(scheduled>=req.lessonsPerWeek) return null; // carga já cumprida
    if(!n.availability.some(a=>a.day===day && a.periods.includes(idx))) return null;
    const teacherBusy = db.schedule.lessons.some(l=>l.teacherId===n.teacherId && l.day===day &&
      overlaps(SEGS[l.segment].periods[l.period].startMin, SEGS[l.segment].periods[l.period].endMin, SEGS[seg].periods[idx].startMin, SEGS[seg].periods[idx].endMin));
    if(teacherBusy) return null;
    if(!n.classIds.every(cid=> !db.schedule.lessons.some(l=>l.classIds.includes(cid) && l.day===day && l.period===idx))) return null;
    return n;
  }).filter(Boolean);

  const modal=document.getElementById('modalRoot');
  modal.innerHTML = `<div class="modal-bg" onclick="closeModal(event)"><div class="modal">
    <h3 style="margin-top:0">${cls.name} — ${DAY_LABELS[day]}, ${idx+1}ª aula</h3>
    ${options.length===0? `<p class="muted">Nenhuma opção válida para este horário (sem disponibilidade, professor ocupado, ou carga já cumprida).</p>` :
      options.map(n=>`<div class="optrow"><div><b>${subjectName(n.subjectId)}</b><div class="muted">${teacherName(n.teacherId)}${n.classIds.length>1?' · junto com '+n.classIds.filter(c=>c!==classId).map(className).join('+'):''}</div></div>
      <button class="btn amber" onclick="placeManual('${n.reqId}', '${n.classIds.join('|')}', '${day}', ${idx})">Colocar</button></div>`).join('')}
    <button class="btn ghost block" style="margin-top:8px" onclick="document.getElementById('modalRoot').innerHTML=''">Cancelar</button>
  </div></div>`;
}
function placeManual(reqId, classIdsStr, day, idx){
  const req = reqOf(reqId);
  const classIds = classIdsStr.split('|');
  const lesson = {id:uid('lsn'), day, period:idx, segment:req.segment, teacherId:req.teacherId,
    subjectId:req.subjectId, classIds, requirementId:req.id};
  db.schedule.lessons.push(lesson);
  db.schedule.audit = auditSchedule(db.schedule.lessons);
  document.getElementById('modalRoot').innerHTML='';
  scheduleSave(); render();
}
function closeModal(e){ if(e.target.classList.contains('modal-bg')) document.getElementById('modalRoot').innerHTML=''; }

function openSubjectPicker(reqId){

  reader.onload=()=>{ try{ db=JSON.parse(reader.result); if(db.schedule) db.schedule.stale=false; scheduleSave(); render(); }catch(e){ alert('Arquivo inválido.'); } };

}

      DAYS.forEach(day => {
        periods.forEach((p, idx) => {
          xml += `<Row ss:Height="22"><Cell ss:StyleID="TimeCol"><Data ss:Type="String">${esc(DAY_LABELS[day])}</Data></Cell><Cell ss:StyleID="TimeCol"><Data ss:Type="String">${idx+1}ª (${p.start}–${p.end})</Data></Cell>`;
          classes.forEach(c => {
            const l = db.schedule ? db.schedule.lessons.find(l => l.day === day && l.period === idx && l.classIds.includes(c.id)) : null;
            const val = l ? `${subjectName(l.subjectId)} (${teacherName(l.teacherId)})` : '—';
            xml += `<Cell ss:StyleID="Cell"><Data ss:Type="String">${esc(val)}</Data></Cell>`;
          });
          xml += `</Row>\n`;
        });
        xml += `<Row ss:Height="8"/>\n`;
      });
      
      xml += `</Table></Worksheet>\n`;
    });

    // Aba Por Professor
    xml += `<Worksheet ss:Name="Por Professor"><Table>\n`;
    xml += `<Column ss:Width="160"/>\n`;
    xml += `<Column ss:Width="110"/>\n`;
    xml += `<Column ss:Width="90"/>\n`;
    xml += `<Column ss:Width="110"/>\n`;
    xml += `<Column ss:Width="200"/>\n`;
    xml += `<Column ss:Width="150"/>\n`;
    xml += `<Row ss:Height="30"><Cell ss:StyleID="Title"><Data ss:Type="String">FORTEC — HORÁRIO POR PROFESSOR</Data></Cell></Row>\n<Row/>\n`;
    xml += `<Row ss:Height="24">
      <Cell ss:StyleID="Header"><Data ss:Type="String">Professor</Data></Cell>
      <Cell ss:StyleID="Header"><Data ss:Type="String">Dia</Data></Cell>
      <Cell ss:StyleID="Header"><Data ss:Type="String">Período</Data></Cell>
      <Cell ss:StyleID="Header"><Data ss:Type="String">Horário</Data></Cell>
      <Cell ss:StyleID="Header"><Data ss:Type="String">Disciplina</Data></Cell>
      <Cell ss:StyleID="Header"><Data ss:Type="String">Turma(s)</Data></Cell>
    </Row>\n`;
    if(db.schedule && db.schedule.lessons){
      db.teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).forEach(t => {
        const lessons = db.schedule.lessons.filter(l => l.teacherId === t.id);
        if(lessons.length === 0) return;
        lessons.sort((a,b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || a.period - b.period);
        lessons.forEach(l => {
          const p = SEGS[l.segment].periods[l.period];
          xml += `<Row ss:Height="20">
            <Cell ss:StyleID="TimeCol"><Data ss:Type="String">${esc(t.name)}</Data></Cell>
            <Cell ss:StyleID="Cell"><Data ss:Type="String">${esc(DAY_LABELS[l.day])}</Data></Cell>
            <Cell ss:StyleID="Cell"><Data ss:Type="String">${l.period + 1}ª aula</Data></Cell>
            <Cell ss:StyleID="Cell"><Data ss:Type="String">${p.start}–${p.end}</Data></Cell>
            <Cell ss:StyleID="Cell"><Data ss:Type="String">${esc(subjectName(l.subjectId))}</Data></Cell>
            <Cell ss:StyleID="Cell"><Data ss:Type="String">${esc(l.classIds.map(className).join(', '))}</Data></Cell>
          </Row>\n`;
        });
      });
    }
    xml += `</Table></Worksheet>\n`;

    // Abas por turma
    db.classes.forEach(c => {
      const periods = SEGS[c.segment].periods;
      xml += `<Worksheet ss:Name="${esc(c.name.slice(0,28))}"><Table>\n`;
      xml += `<Column ss:Width="130"/>\n`;
      DAYS.forEach(() => { xml += `<Column ss:Width="200"/>\n`; });
      xml += `<Row ss:Height="30"><Cell ss:StyleID="Title"><Data ss:Type="String">FORTEC — HORÁRIO ESCOLAR — ${esc(c.name.toUpperCase())}</Data></Cell></Row>\n<Row/>\n`;
      xml += `<Row ss:Height="24"><Cell ss:StyleID="Header"><Data ss:Type="String">Período / Horário</Data></Cell>`;
      DAYS.forEach(d => { xml += `<Cell ss:StyleID="Header"><Data ss:Type="String">${esc(DAY_LABELS[d])}</Data></Cell>`; });
      xml += `</Row>\n`;
      periods.forEach((p, idx) => {
        xml += `<Row ss:Height="22"><Cell ss:StyleID="TimeCol"><Data ss:Type="String">${idx+1}ª aula (${p.start}–${p.end})</Data></Cell>`;
        DAYS.forEach(day => {
          const l = db.schedule ? db.schedule.lessons.find(l => l.day === day && l.period === idx && l.classIds.includes(c.id)) : null;
          const val = l ? `${subjectName(l.subjectId)} (${teacherName(l.teacherId)})` : '—';
          xml += `<Cell ss:StyleID="Cell"><Data ss:Type="String">${esc(val)}</Data></Cell>`;
        });
        xml += `</Row>\n`;
      });
      xml += `</Table></Worksheet>\n`;
    });

    xml += '</Workbook>';

    downloadText('fortec-horario-perfeito.xls', xml, 'application/vnd.ms-excel;charset=utf-8');
    showSaveIndicator('✓ Planilha Excel baixada com sucesso!');
  } catch(e) {
    console.error('Falha ao exportar Excel:', e);
    alert('Erro ao gerar Excel: ' + e.message);
  }
}
// Exportação sem dependência externa nenhuma — sempre funciona, mesmo offline.
function exportCSVFallback(){
  if(!db.schedule){ alert('Nenhum horário gerado ainda.'); return; }
  let csv = 'Turma;Segmento;Dia;Período;Horário;Disciplina;Professor\n';
  db.schedule.lessons.slice().sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || a.period-b.period)
    .forEach(l=>{
      const p = SEGS[l.segment].periods[l.period];
      l.classIds.forEach(cid=>{
        csv += `"${className(cid)}";"${SEGS[l.segment].label}";"${DAY_LABELS[l.day]}";"${l.period+1}ª aula";"${p.start}–${p.end}";"${subjectName(l.subjectId)}";"${teacherName(l.teacherId)}"\n`;
      });
    });
  downloadText('fortec-horario.csv', csv, 'text/csv;charset=utf-8');
}
function downloadText(filename, content, mime){
  try{
    const blob = new Blob(['\uFEFF'+content], {type: mime||'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showSaveIndicator('✓ baixando '+filename);
  }catch(e){
    console.error('Falha no download:', e);
    alert('Não consegui iniciar o download automaticamente. Tente segurar o botão ou usar outro navegador. Erro: '+e.message);
  }
}

/* ---- ÁREA DO PROFESSOR ---- */
function renderTeacherSelf(){
  document.getElementById('navTabs').innerHTML='';
  const main=document.getElementById('main');
  if(!state.teacherSelfId){
    main.innerHTML = `<div class="card">
      <span class="label">Professor</span>
      <select class="input" onchange="pickTeacherSelf(this.value)">
        <option value="">Escolha seu nome…</option>
        ${db.teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
      </select>
      ${db.teachers.length===0? '<p class="muted" style="margin-top:8px">Nenhum professor cadastrado ainda pela escola.</p>':''}
    </div>`;
    return;
  }
  const t = db.teachers.find(x=>x.id===state.teacherSelfId);
  const reqs = requirementsForTeacher(t.id);
  main.innerHTML = `<div class="card"><div class="spaced"><h3 style="margin:0">${t.name}</h3>
    <button class="smallbtn" style="color:var(--navy);border-color:var(--line)" onclick="state.teacherSelfId=null;render()">trocar</button></div></div>
    ${reqs.length===0? '<p class="muted">Nenhuma disciplina vinculada a você ainda — peça para a escola cadastrar.</p>' :
      reqs.map(r=>`<div class="card">
        <b>${r.subjectId?subjectName(r.subjectId):'(disciplina não definida)'}</b>
        <div class="muted">${r.classIds.map(className).join(', ')||'sem turmas'} · ${SEGS[r.segment].label}</div>
        ${renderAvailGrid(r)}
      </div>`).join('')}
    ${reqs.length? `<div class="ok"><span>✓ Disponibilidade salva automaticamente</span></div>`:''}`;
}
function pickTeacherSelf(id){ state.teacherSelfId=id||null; render(); }

(async function init(){
  await loadDb();
  if(db.schedule && !db.schedule.audit){ db.schedule.audit = auditSchedule(db.schedule.lessons); }
  render();
  document.getElementById('roleGate').classList.remove('hidden');
})();
</script>
